#!/usr/bin/env python
PACKAGE = "first_project"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

frames = gen.enum([gen.const("wheel_odom", str_t, "wheel_odom", "Encoder odometry frame"),
                   gen.const("gps_odom", str_t, "gps_odom", "GPS odometry frame")],
                  "Frame the point cloud is attached to")
gen.add("frame_id", str_t, 0, "Current frame set", "gps_odom", edit_method=frames)

exit(gen.generate(PACKAGE, "first_project", "lidar_remap"))
